<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>業務予定表アプリ</title>
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for parsing JSX (CDN) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* アニメーション用スタイル */
    @keyframes ping {
      75%, 100% { transform: scale(2); opacity: 0; }
    }
    .animate-ping { animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite; }
  </style>
</head>
<body class="bg-gray-100">
  
  <!-- アプリの描画先 -->
  <div id="root"></div>

  <!-- React & Firebase App Code -->
  <script type="text/babel" data-type="module">
    // Firebase ES Modules (CDN)
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const { useState, useEffect, useRef } = React;

    // --- Firebase Setup ---
    // TODO: 実際のFirebaseプロジェクトの設定情報に書き換えてください
    const firebaseConfig = {
      apiKey: "AIzaSyBN2GtZJdpNZIL0jTsQH5GS9pdDMcBWLpo",
      authDomain: "gyomu-yotei-app.firebaseapp.com",
      projectId: "gyomu-yotei-app",
      storageBucket: "gyomu-yotei-app.firebasestorage.app",
      messagingSenderId: "548782544078",
      appId: "1:548782544078:web:7fa03ae1e72749546eec9f"
    };
    
    // Firebaseの初期化
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = 'shared-calendar-app'; // 保存先コレクションの区別用ID

    // --- アイコンコンポーネント (lucide-reactの代わり) ---
    const ChevronLeft = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m15 18-6-6 6-6"/></svg>;
    const ChevronRight = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>;
    const Trash2 = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>;
    const CalendarIcon = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;
    const User = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    const Users = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
    const Edit3 = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>;
    const X = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
    const Plus = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
    const Settings = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>;
    const Clock = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;

    // --- アプリのメインコード ---
    const PALETTES = [
      { tabBg: 'bg-purple-500', tabShadow: 'shadow-[0_4px_0_#7e22ce]', tabActive: 'bg-purple-600', badgeBg: 'bg-purple-100', badgeText: 'text-purple-700', iconBg: 'bg-[#8B5CF6]' },
      { tabBg: 'bg-green-500', tabShadow: 'shadow-[0_4px_0_#15803d]', tabActive: 'bg-green-600', badgeBg: 'bg-green-100', badgeText: 'text-green-700', iconBg: 'bg-[#10B981]' },
      { tabBg: 'bg-pink-500', tabShadow: 'shadow-[0_4px_0_#be185d]', tabActive: 'bg-pink-600', badgeBg: 'bg-pink-100', badgeText: 'text-pink-700', iconBg: 'bg-[#EC4899]' },
      { tabBg: 'bg-yellow-500', tabShadow: 'shadow-[0_4px_0_#a16207]', tabActive: 'bg-yellow-600', badgeBg: 'bg-yellow-100', badgeText: 'text-yellow-700', iconBg: 'bg-[#F59E0B]' },
      { tabBg: 'bg-teal-500', tabShadow: 'shadow-[0_4px_0_#0f766e]', tabActive: 'bg-teal-600', badgeBg: 'bg-teal-100', badgeText: 'text-teal-700', iconBg: 'bg-[#14B8A6]' },
      { tabBg: 'bg-red-500', tabShadow: 'shadow-[0_4px_0_#b91c1c]', tabActive: 'bg-red-600', badgeBg: 'bg-red-100', badgeText: 'text-red-700', iconBg: 'bg-[#EF4444]' },
      { tabBg: 'bg-indigo-500', tabShadow: 'shadow-[0_4px_0_#4338ca]', tabActive: 'bg-indigo-600', badgeBg: 'bg-indigo-100', badgeText: 'text-indigo-700', iconBg: 'bg-[#6366F1]' },
      { tabBg: 'bg-gray-500', tabShadow: 'shadow-[0_4px_0_#4b5563]', tabActive: 'bg-gray-600', badgeBg: 'bg-gray-100', badgeText: 'text-gray-700', iconBg: 'bg-[#6B7280]' },
    ];

    const DEFAULT_MEMBERS = [
      { id: 'default-1', name: '渡辺　真行', colorIndex: 0 },
      { id: 'default-2', name: '大橋　英幸', colorIndex: 1 }
    ];

    function App() {
      const isWatanabe = (name) => name === DEFAULT_MEMBERS[0].name;
      const isOhashi = (name) => name === DEFAULT_MEMBERS[1].name;

      const [user, setUser] = useState(null);
      const [events, setEvents] = useState([]);
      const [customMembers, setCustomMembers] = useState([]);
      const allMembers = [...DEFAULT_MEMBERS, ...customMembers];

      const [currentDate, setCurrentDate] = useState(new Date());
      const [currentTime, setCurrentTime] = useState(new Date()); // 追加: 現在時刻用
      
      const [showAddModal, setShowAddModal] = useState(false);
      const [showAddMemberModal, setShowAddMemberModal] = useState(false);
      const [showManageMembersModal, setShowManageMembersModal] = useState(false);
      const [memberToDelete, setMemberToDelete] = useState(null);
      
      const [newMemberLastName, setNewMemberLastName] = useState('');
      const [newMemberFirstName, setNewMemberFirstName] = useState('');
      const firstNameRef = useRef(null);
      
      const [selectedDateForAdd, setSelectedDateForAdd] = useState(new Date());
      const [newEventTitle, setNewEventTitle] = useState('');
      const [newEventNote, setNewEventNote] = useState('');
      const [selectedPerson, setSelectedPerson] = useState(DEFAULT_MEMBERS[0].name);
      const [newEventHour, setNewEventHour] = useState('');
      const [newEventMinute, setNewEventMinute] = useState('');
      const [newEventType, setNewEventType] = useState('現場');
      const [editingEventId, setEditingEventId] = useState(null);

      const [filterPerson, setFilterPerson] = useState('全員');

      const [actingUser, setActingUser] = useState('閲覧者');
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [inputPassword, setInputPassword] = useState('');
      const [passwordError, setPasswordError] = useState('');
      const [pendingUser, setPendingUser] = useState('');
      const [lastUpdated, setLastUpdated] = useState(null);
      const [highlightDay, setHighlightDay] = useState(null);

      // 管理者（社長）パスワード
      const ADMIN_PASSWORD = '0721';

      const isPresident = isWatanabe(actingUser) && isAuthenticated;

      const handleUserChange = (e) => {
        const selectedUser = e.target.value;
        if (isWatanabe(selectedUser)) {
          setPendingUser(selectedUser);
          setShowPasswordModal(true);
          setInputPassword('');
          setPasswordError('');
        } else {
          setActingUser(selectedUser);
          setIsAuthenticated(false);
        }
      };

      const handlePasswordSubmit = (e) => {
        e.preventDefault();
        if (inputPassword === ADMIN_PASSWORD) {
          setActingUser(pendingUser);
          setIsAuthenticated(true);
          setShowPasswordModal(false);
        } else {
          setPasswordError('パスワードが間違っています');
        }
      };

      const getStartOfWeek = (date) => {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day;
        d.setDate(diff);
        d.setHours(0, 0, 0, 0);
        return d;
      };
      const [referenceDate, setReferenceDate] = useState(getStartOfWeek(new Date()));

      // 追加: 1秒ごとに現在時刻を更新するタイマー
      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentTime(new Date());
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // 認証とデータ取得
      useEffect(() => {
        const initAuth = async () => {
          try {
            // Firebase設定が正しく行われている場合のみ匿名ログインを実行
            if(firebaseConfig.apiKey !== "YOUR_API_KEY") {
              await signInAnonymously(auth);
            } else {
              console.warn("Firebase設定がデフォルトのままです。コード内の firebaseConfig を書き換えてください。");
            }
          } catch (error) {
            console.error("Auth error:", error);
          }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, setUser);
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;

        const eventsRef = collection(db, 'artifacts', appId, 'public', 'data', 'shared_events');
        const unsubscribeEvents = onSnapshot(
          eventsRef,
          (snapshot) => {
            const fetchedEvents = snapshot.docs.map(doc => ({
              id: doc.id,
              ...doc.data()
            }));
            setEvents(fetchedEvents);
          },
          (error) => console.error("Firestore events error:", error)
        );

        const membersRef = collection(db, 'artifacts', appId, 'public', 'data', 'shared_members');
        const unsubscribeMembers = onSnapshot(
          membersRef,
          (snapshot) => {
            const fetchedMembers = snapshot.docs.map(doc => ({
              id: doc.id,
              ...doc.data()
            }));
            fetchedMembers.sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
            setCustomMembers(fetchedMembers);
          },
          (error) => console.error("Firestore members error:", error)
        );

        return () => {
          unsubscribeEvents();
          unsubscribeMembers();
        };
      }, [user]);

      useEffect(() => {
        if (events.length > 0) {
          const latest = events.reduce((latestDate, event) => {
            const dateStr = event.updatedAt || event.createdAt;
            if (!dateStr) return latestDate;
            const date = new Date(dateStr);
            return date > latestDate ? date : latestDate;
          }, new Date(0));

          if (latest.getTime() > 0) {
            setLastUpdated(latest);
          }
        } else {
          setLastUpdated(null);
        }
      }, [events]);

      const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
      const getDayOfWeekStr = (year, month, day) => {
        const days = ['日', '月', '火', '水', '木', '金', '土'];
        return days[new Date(year, month, day).getDay()];
      };

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const daysInMonth = getDaysInMonth(year, month);
      const daysArray = Array.from({ length: daysInMonth }, (_, i) => i + 1);

      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const calendarDays = Array(firstDayOfMonth).fill(null).concat(daysArray);

      const prevMonth = () => setCurrentDate(new Date(year, month - 1, 1));
      const nextMonth = () => setCurrentDate(new Date(year, month + 1, 1));

      const formatDateString = (y, m, d) => {
        const padM = String(m + 1).padStart(2, '0');
        const padD = String(d).padStart(2, '0');
        return `${y}-${padM}-${padD}`;
      };

      const getNextWeekRange = () => {
        const start = new Date(referenceDate.getFullYear(), referenceDate.getMonth(), referenceDate.getDate());
        const end = new Date(start);
        end.setDate(start.getDate() + 6);
        return { start, end };
      };
      const { start: nwStart, end: nwEnd } = getNextWeekRange();

      const formatWeekDate = (date) => {
        const m = date.getMonth() + 1;
        const d = date.getDate();
        const days = ['日', '月', '火', '水', '木', '金', '土'];
        const dayStr = days[date.getDay()];
        return `${m}/${d}(${dayStr})`;
      };

      const prevWeek = () => {
        const newDate = new Date(referenceDate);
        newDate.setDate(newDate.getDate() - 7);
        setReferenceDate(newDate);
        if (newDate.getMonth() !== currentDate.getMonth()) {
          setCurrentDate(new Date(newDate.getFullYear(), newDate.getMonth(), 1));
        }
      };

      const nextWeek = () => {
        const newDate = new Date(referenceDate);
        newDate.setDate(newDate.getDate() + 7);
        setReferenceDate(newDate);
        if (newDate.getMonth() !== currentDate.getMonth()) {
          setCurrentDate(new Date(newDate.getFullYear(), newDate.getMonth(), 1));
        }
      };

      const scrollToDate = (day) => {
        const row = document.getElementById(`row-day-${day}`);
        if (row) {
          const y = row.getBoundingClientRect().top + window.scrollY - 100;
          window.scrollTo({ top: y, behavior: 'smooth' });
          setHighlightDay(day);
          setTimeout(() => setHighlightDay(null), 2000);
        }
      };

      const getWeekOverlayBorders = (isNextWeek, isFirstRow, isLastRow, colType, isTopBorderDay, isBottomBorderDay, isMergedCell = false) => {
        if (!isNextWeek) return {};
        const BORDER_STYLE = '5px solid #f97316';
        let style = {};
        if (isMergedCell) {
          if (isTopBorderDay) style.borderTop = BORDER_STYLE;
          if (isBottomBorderDay) style.borderBottom = BORDER_STYLE;
          if (colType === 'first') style.borderLeft = BORDER_STYLE;
          if (colType === 'last') style.borderRight = BORDER_STYLE;
        } else {
          if (isTopBorderDay && isFirstRow) style.borderTop = BORDER_STYLE;
          if (isBottomBorderDay && isLastRow) style.borderBottom = BORDER_STYLE;
          if (colType === 'first') style.borderLeft = BORDER_STYLE;
          if (colType === 'last') style.borderRight = BORDER_STYLE;
        }
        return style;
      };

      const getMemberInfo = (personName) => {
        if (isWatanabe(personName)) return DEFAULT_MEMBERS[0];
        if (isOhashi(personName)) return DEFAULT_MEMBERS[1];
        const found = allMembers.find(m => m.name === personName);
        if (found) return found;
        return { id: personName, name: personName, colorIndex: 7 };
      };

      const handleAddEventClick = (day) => {
        setSelectedDateForAdd(new Date(year, month, day));
        setShowAddModal(true);
        setEditingEventId(null);
        setNewEventHour('');
        setNewEventMinute('');
        setNewEventTitle('');
        setNewEventNote('');
        setNewEventType('現場');
        if (filterPerson !== '全員') {
          setSelectedPerson(filterPerson);
        } else {
          setSelectedPerson(DEFAULT_MEMBERS[0].name);
        }
      };

      const handleEditEventClick = (event, day) => {
        setSelectedDateForAdd(new Date(year, month, day));
        setEditingEventId(event.id);
        setNewEventTitle(event.title || '');
        setNewEventNote(event.note || '');
        setNewEventType(event.type || '現場');
        setSelectedPerson(event.person || DEFAULT_MEMBERS[0].name);
        
        if (event.time) {
          const [hour, minute] = event.time.split(':');
          setNewEventHour(hour || '');
          setNewEventMinute(minute || '');
        } else {
          setNewEventHour('');
          setNewEventMinute('');
        }
        
        setShowAddModal(true);
      };

      const handleAddEvent = async (e) => {
        e.preventDefault();
        if (!user) return;

        try {
          const eventsRef = collection(db, 'artifacts', appId, 'public', 'data', 'shared_events');
          
          let timeStr = '';
          if (newEventHour && newEventMinute) {
            timeStr = `${newEventHour.padStart(2, '0')}:${newEventMinute.padStart(2, '0')}`;
          } else if (newEventHour) {
            timeStr = `${newEventHour.padStart(2, '0')}:00`;
          } else if (newEventMinute) {
            timeStr = `00:${newEventMinute.padStart(2, '0')}`;
          }

          const eventData = {
            title: newEventTitle.trim(),
            note: newEventNote.trim(),
            dateStr: formatDateString(selectedDateForAdd.getFullYear(), selectedDateForAdd.getMonth(), selectedDateForAdd.getDate()),
            time: timeStr,
            type: newEventType,
            person: selectedPerson,
            updatedAt: new Date().toISOString()
          };

          if (editingEventId) {
            const eventDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'shared_events', editingEventId);
            await updateDoc(eventDocRef, eventData);
          } else {
            eventData.createdAt = new Date().toISOString();
            await addDoc(eventsRef, eventData);
          }
          
          setShowAddModal(false);
          setNewEventTitle('');
          setNewEventNote('');
          setNewEventHour('');
          setNewEventMinute('');
          setEditingEventId(null);
        } catch (error) {
          console.error("Error adding/updating event:", error);
        }
      };

      const handleDeleteEvent = async (eventId) => {
        if (!user) return;
        try {
          const eventRef = doc(db, 'artifacts', appId, 'public', 'data', 'shared_events', eventId);
          await deleteDoc(eventRef);
        } catch (error) {
          console.error("Error deleting event:", error);
        }
      };

      const handleAddMember = async (e) => {
        e.preventDefault();
        if (!newMemberLastName.trim() || !newMemberFirstName.trim() || !user) return;

        try {
          const membersRef = collection(db, 'artifacts', appId, 'public', 'data', 'shared_members');
          const fullName = `${newMemberLastName.trim()}　${newMemberFirstName.trim()}`;
          
          const newMemberData = {
            name: fullName,
            colorIndex: allMembers.length,
            createdAt: new Date().toISOString()
          };
          await addDoc(membersRef, newMemberData);
          setNewMemberLastName('');
          setNewMemberFirstName('');
          setShowAddMemberModal(false);
        } catch (error) {
          console.error("Error adding member:", error);
        }
      };

      const handleDeleteMember = async () => {
        if (!memberToDelete || !user) return;

        try {
          const memberRef = doc(db, 'artifacts', appId, 'public', 'data', 'shared_members', memberToDelete.id);
          await deleteDoc(memberRef);
          
          if (filterPerson === memberToDelete.name) {
            setFilterPerson('全員');
          }
          
          setMemberToDelete(null);
        } catch (error) {
          console.error("Error deleting member:", error);
        }
      };

      const filteredEvents = events.filter(e => {
        if (filterPerson === '全員') return true;
        const targetMem = getMemberInfo(filterPerson);
        const evMem = getMemberInfo(e.person);
        return targetMem.id === evMem.id;
      });

      const getEventsForDay = (day) => {
        const checkDateStr = formatDateString(year, month, day);
        return filteredEvents
          .filter(e => e.dateStr === checkDateStr)
          .sort((a, b) => (a.time || '24:00').localeCompare(b.time || '24:00'));
      };

      const getDayColor = (year, month, day) => {
        const dayOfWeek = new Date(year, month, day).getDay();
        if (dayOfWeek === 0) return 'text-red-600 bg-red-50/50';
        if (dayOfWeek === 6) return 'text-[#124285] bg-blue-50/50';
        return 'text-black';
      };

      const getTypeBadgeColor = (type) => {
        switch(type) {
          case '現場': return 'bg-orange-100 text-orange-700 border-orange-200';
          case '内業': return 'bg-blue-100 text-blue-700 border-blue-200';
          case '打合せ': return 'bg-green-100 text-green-700 border-green-200';
          case '休み': return 'bg-red-100 text-red-700 border-red-200';

        if (!date) return '';
        const m = date.getMonth() + 1;
        const d = date.getDate();
        const h = String(date.getHours()).padStart(2, '0');
        const min = String(date.getMinutes()).padStart(2, '0');
        return `${m}/${d} ${h}:${min}`;

      if (!user && firebaseConfig.apiKey !== "YOUR_API_KEY") {
        return <div className="flex items-center justify-center h-screen font-bold text-gray-600"><p>データを読み込んでいます...</p></div>;

                      <span className="relative inline-flex rounded-full h-2 w-2 bg-yellow-300"></span>
                    </span>

            </div>

              <button

                className={`flex-auto min-w-[85px] max-w-[105px] sm:min-w-[100px] sm:max-w-[180px] flex justify-center items-center gap-1 sm:gap-2 py-2 sm:py-3 rounded-lg sm:rounded-xl text-[10px] sm:text-base font-bold transition-all duration-100 text-white select-none outline-none
                  ${filterPerson === '全員'
                    ? `bg-blue-600 translate-y-1 shadow-[inset_0_4px_8px_rgba(0,0,0,0.4)]`

                `}
              >
                <Users className="w-3.5 h-3.5 sm:w-[18px] sm:h-[18px]" />

                  <button

                      ${isActive

                  >
                    <span className="truncate px-0.5 sm:px-1">

              {isPresident && (

                  title="メンバーを管理"
                >
                  <Settings className="w-4 h-4 sm:w-5 sm:h-5" />
                </button>
              )}
            </div>

            {/* 前週・次週コントロールバー */}

                <span className="hidden sm:inline">前 週</span>

                <span className="hidden sm:inline">次 週</span>
                <div className="p-1 sm:p-1.5 border border-gray-300 bg-white rounded shadow-sm group-hover:bg-gray-100 transition">
                  <ChevronRight size={20} />
                </div>
              </button>
            </div>

            {/* 月切り替え */}
            <div className="py-4 flex justify-center items-center bg-white">
              <div className="flex items-center justify-center gap-4 sm:gap-8 w-full">
                <button onClick={prevMonth} className="p-2 text-gray-400 hover:text-gray-700 transition hover:bg-gray-50 rounded-full">
                  <ChevronLeft size={24} />
                </button>
                <h2 className="text-2xl sm:text-3xl font-bold text-[#124285] tracking-widest min-w-[140px] sm:min-w-[180px] text-center">

                <button onClick={nextMonth} className="p-2 text-gray-400 hover:text-gray-700 transition hover:bg-gray-50 rounded-full">
                  <ChevronRight size={24} />
                </button>
              </div>
            </div>

            {/* カレンダー本体 */}
            <div className="px-1 sm:px-4 pb-4 bg-white">
              <div className="w-full p-[2px]">
                <div className="grid grid-cols-7 text-center border-2 border-slate-700 w-full relative">
                  {['日', '月', '火', '水', '木', '金', '土'].map((dow, i) => {
                    const bgClass = i === 0 ? 'bg-red-50' : i === 6 ? 'bg-blue-50' : 'bg-indigo-50';
                    const textClass = i === 0 ? 'text-red-600' : i === 6 ? 'text-blue-600' : 'text-gray-700';
                    const bRightClass = i === 6 ? '' : 'border-r-2 border-slate-700';
                    return (
                      <div key={dow} className={`py-2 text-sm font-bold border-b-2 border-slate-700 ${bRightClass} ${bgClass} ${textClass}`}>
                        {dow}
                      </div>
                    );
                  })}
                  
                  {calendarDays.map((day, index) => {
                    const colIndex = index % 7;
                    const rowIndex = Math.floor(index / 7);
                    const totalRows = Math.ceil(calendarDays.length / 7);
                    const isLastRow = rowIndex === totalRows - 1;

                    const bRightClass = colIndex === 6 ? '' : 'border-r-2 border-slate-700';
                    const bBottomClass = isLastRow ? '' : 'border-b border-slate-700';

                    if (day === null) {
                      return <div key={`empty-${index}`} className={`min-h-[80px] sm:min-h-[120px] bg-gray-50 ${bRightClass} ${bBottomClass}`}></div>;
                    }
                    
                    const dayEvents = getEventsForDay(day);
                    const dayOfWeek = new Date(year, month, day).getDay();
                    const isToday = new Date().getDate() === day && new Date().getMonth() === month && new Date().getFullYear() === year;
                    
                    const currentRowDate = new Date(year, month, day);
                    const isNextWeek = currentRowDate >= nwStart && currentRowDate <= nwEnd;
                    
                    return (
                      <div 
                        key={day} 
                        onClick={() => {
                          if (isPresident) {
                            handleAddEventClick(day);
                          } else {
                            scrollToDate(day);
                          }
                        }}
                        className={`min-w-0 min-h-[80px] sm:min-h-[120px] p-0.5 sm:p-1 flex flex-col items-center justify-start transition-colors relative ${bRightClass} ${bBottomClass}
                          ${isToday ? 'bg-[#FFF9C4]' : 'bg-white'}
                          cursor-pointer hover:bg-gray-50
                        `}
                        title={isPresident ? "クリックして予定を追加" : "クリックして詳細リストへ移動"}
                      >
                        {isNextWeek && (
                          <div 
                            className={`absolute -inset-[2px] pointer-events-none z-[20]`}
                            style={{
                              borderTop: '5px solid #f97316',
                              borderBottom: '5px solid #f97316',
                              borderLeft: (dayOfWeek === 0 || day === 1) ? '5px solid #f97316' : 'none',
                              borderRight: (dayOfWeek === 6 || day === daysInMonth) ? '5px solid #f97316' : 'none',
                            }}
                          />
                        )}
                        <span className={`relative z-[30] text-xs sm:text-lg font-bold mb-0.5 sm:mb-1 ${dayOfWeek === 0 ? 'text-red-600' : dayOfWeek === 6 ? 'text-[#124285]' : 'text-black'}`}>
                          {day}
                        </span>
                        
                        <div className="relative z-[30] flex-1 flex flex-col gap-0.5 sm:gap-1 w-full px-0 sm:px-1 items-center justify-start overflow-hidden">
                          {dayEvents.slice(0, 3).map(ev => (
                            <div 
                              key={ev.id} 
                              className={`text-center w-full bg-white/80 rounded border border-gray-100 p-0.5 shadow-sm overflow-hidden cursor-pointer hover:bg-white transition-colors`}
                              onClick={(e) => { 
                                e.stopPropagation(); 
                                if (isPresident) {
                                  handleEditEventClick(ev, day); 
                                } else {
                                  scrollToDate(day);
                                }
                              }}
                              title={`${ev.person}: ${ev.type} ${ev.time} ${ev.title}`}
                            >
                              {filterPerson === '全員' ? (
                                <div className="flex items-center gap-0.5 w-full justify-start sm:justify-center overflow-hidden px-0.5">
                                  {(() => {
                                    const memInfo = getMemberInfo(ev.person);
                                    const palette = PALETTES[memInfo.colorIndex % PALETTES.length] || PALETTES[7];
                                    return (
                                      <span className={`${palette.iconBg} text-white text-[8px] sm:text-[9px] font-bold px-0.5 sm:px-1 rounded-sm shrink-0 leading-none py-0.5`}>
                                        {memInfo.name.charAt(0)}
                                      </span>
                                    );
                                  })()}
                                  <span className={`font-bold text-[8px] sm:text-[10px] truncate leading-none py-0.5 ${ev.type === '休み' ? 'text-red-600' : 'text-gray-800'}`}>

                                  </span>
                                </div>
                              ) : (

                                    {(() => {
                                      const memInfo = getMemberInfo(ev.person);
                                      const palette = PALETTES[memInfo.colorIndex % PALETTES.length] || PALETTES[7];
                                      return (
                                        <span className={`${palette.iconBg} text-white text-[8px] sm:text-[9px] font-bold px-0.5 sm:px-1 rounded-sm shrink-0 leading-none py-0.5`}>

                                        </span>
                                      );
                                    })()}
                                    <span className="font-bold text-[8px] sm:text-[10px] text-gray-800 truncate leading-none">
                                      {ev.type}

                                  </div>

                                  {/* 2段目: 時間 */}
                                  <span className="font-bold text-[8px] sm:text-[11px] text-black truncate leading-none mt-0.5 sm:mt-1 w-full text-left sm:text-center">
                                    {ev.time}

                                  {/* 3段目: 現場名 */}
                                  <span className="text-[8px] sm:text-xs font-bold text-gray-800 break-words sm:truncate leading-tight mt-0.5 sm:mt-1 w-full text-left sm:text-center line-clamp-2 sm:line-clamp-none">
                                    {ev.title}
                                  </span>

                                  {/* 4段目: 備考（入力がある場合のみ表示） */}
                                  {ev.note && (

                                    </span>

                            <div className="text-[8px] sm:text-[10px] text-gray-500 text-center font-bold w-full leading-none mt-0.5">

                      </div>

              </div>
            </div>
          </div>

                    {daysArray.map(day => {
                    const dayEvents = getEventsForDay(day);
                    const dayOfWeekStr = getDayOfWeekStr(year, month, day);
                    const dayColorClass = getDayColor(year, month, day);
                    const isTodayObj = new Date().getDate() === day && new Date().getMonth() === month && new Date().getFullYear() === year;

                    const currentRowDate = new Date(year, month, day);
                    const isNextWeek = currentRowDate >= nwStart && currentRowDate <= nwEnd;
                    const isTopBorderDay = isNextWeek && (currentRowDate.getTime() === nwStart.getTime() || day === 1);
                    const isBottomBorderDay = isNextWeek && (currentRowDate.getTime() === nwEnd.getTime() || day === daysInMonth);

                    let baseTrClass = 'transition-colors duration-500 ';
                    if (highlightDay === day) {
                      baseTrClass += 'bg-blue-100';
                    } else if (isTodayObj) {
                      baseTrClass += 'bg-[#FFF9C4] hover:bg-[#FFF5A0]';
                    } else if (isNextWeek) {
                      baseTrClass += 'bg-orange-50/10 hover:bg-orange-50/40';
                    } else {
                      baseTrClass += 'hover:bg-gray-50';
                    }

                      const bBottomClass = day === daysInMonth ? '' : 'border-b border-slate-700';

                        <tr key={day} id={`row-day-${day}`} className={baseTrClass}>

                            {isNextWeek && <div className="absolute -inset-[2px] pointer-events-none z-[20]" style={getWeekOverlayBorders(isNextWeek, true, true, 'first', isTopBorderDay, isBottomBorderDay, true)} />}

                          </td>
                          {filterPerson === '全員' && (
                            <td className={`relative py-1.5 sm:py-3 px-0.5 sm:px-2 border-r-2 border-slate-700 ${bBottomClass} text-center`}>
                              {isNextWeek && <div className="absolute -inset-[2px] pointer-events-none z-[20]" style={getWeekOverlayBorders(isNextWeek, true, true, 'mid', isTopBorderDay, isBottomBorderDay)} />}
                            </td>
                          )}
                          <td className={`relative py-1.5 sm:py-3 px-0.5 sm:px-2 border-r-2 border-slate-700 ${bBottomClass} text-center`}>
                            {isNextWeek && <div className="absolute -inset-[2px] pointer-events-none z-[20]" style={getWeekOverlayBorders(isNextWeek, true, true, 'mid', isTopBorderDay, isBottomBorderDay)} />}
                          </td>
                          <td className={`relative py-1.5 sm:py-3 px-0.5 sm:px-2 border-r-2 border-slate-700 ${bBottomClass} text-center`}>
                            {isNextWeek && <div className="absolute -inset-[2px] pointer-events-none z-[20]" style={getWeekOverlayBorders(isNextWeek, true, true, 'mid', isTopBorderDay, isBottomBorderDay)} />}
                          </td>
                          <td className={`relative py-1.5 sm:py-3 px-0.5 sm:px-4 border-r-2 border-slate-700 ${bBottomClass} text-center text-gray-400 text-[10px] sm:text-sm`}>
                            {isNextWeek && <div className="absolute -inset-[2px] pointer-events-none z-[20]" style={getWeekOverlayBorders(isNextWeek, true, true, 'mid', isTopBorderDay, isBottomBorderDay)} />}
                          </td>
                          <td className={`relative py-1.5 sm:py-3 px-0.5 sm:px-2 ${isPresident ? 'border-r-2 border-slate-700' : ''} ${bBottomClass} text-center text-gray-400 text-[10px] sm:text-sm`}>
                            {isNextWeek && <div className="absolute -inset-[2px] pointer-events-none z-[20]" style={getWeekOverlayBorders(isNextWeek, true, true, !isPresident ? 'last' : 'mid', isTopBorderDay, isBottomBorderDay)} />}
                          </td>
                          {isPresident && (
                            <td className={`relative py-1.5 sm:py-3 px-0.5 sm:px-2 ${bBottomClass} text-center`}>
                              {isNextWeek && <div className="absolute -inset-[2px] pointer-events-none z-[20]" style={getWeekOverlayBorders(isNextWeek, true, true, 'last', isTopBorderDay, isBottomBorderDay)} />}
                              <div className="flex justify-center items-center relative z-30">
                                <button onClick={() => handleAddEventClick(day)} className="p-1 sm:p-1.5 text-gray-400 hover:text-[#1E5A99] hover:bg-blue-50 rounded transition" title="予定を追加">
                                  <Edit3 className="w-3.5 h-3.5 sm:w-4 sm:h-4" />
                                </button>
                              </div>
                            </td>
                          )}
                        </tr>
                      );
                    }

                    return dayEvents.map((event, index) => {
                      const isFirstRow = index === 0;
                      const isLastRow = index === dayEvents.length - 1;
                      const bBottomClass = (day === daysInMonth && isLastRow) ? '' : 'border-b border-slate-700';
                      const firstColBottomClass = day === daysInMonth ? '' : 'border-b border-slate-700';

                      return (
                      <tr key={event.id} id={isFirstRow ? `row-day-${day}` : undefined} className={baseTrClass}>
                        {isFirstRow && (
                          <td 
                            rowSpan={dayEvents.length} 
                            className={`relative py-1.5 sm:py-3 px-0.5 sm:px-2 border-r-2 border-slate-700 ${firstColBottomClass} text-center font-bold align-middle ${dayColorClass} text-[11px] sm:text-base ${isTodayObj && highlightDay !== day ? 'bg-[#FFF9C4]' : ''}`}
                          >
                             {isNextWeek && <div className="absolute -inset-[2px] pointer-events-none z-[20]" style={getWeekOverlayBorders(isNextWeek, isFirstRow, isLastRow, 'first', isTopBorderDay, isBottomBorderDay, true)} />}
                             {day} <br className="sm:hidden" /><span className="text-[9px] sm:text-xs">({dayOfWeekStr})</span>
                          </td>
                        )}
                        
                        {filterPerson === '全員' && (
                          <td className={`relative py-1.5 sm:py-3 px-0.5 sm:px-2 border-r-2 border-slate-700 ${bBottomClass} text-center`}>
                            {isNextWeek && <div className="absolute -inset-[2px] pointer-events-none z-[20]" style={getWeekOverlayBorders(isNextWeek, isFirstRow, isLastRow, 'mid', isTopBorderDay, isBottomBorderDay)} />}
                            <div className="relative z-10 flex justify-center">
                            {(() => {
                              const memInfo = getMemberInfo(event.person);
                              const palette = PALETTES[memInfo.colorIndex % PALETTES.length] || PALETTES[7];
                              return (
                                <span className={`text-[9px] sm:text-xs px-1 sm:px-2 py-0.5 sm:py-1 rounded font-bold whitespace-nowrap ${palette.badgeBg} ${palette.badgeText}`}>
                                  {memInfo.name.split('　')[0].split(' ')[0]}
                                </span>
                              );
                            })()}
                            </div>
                          </td>
                        )}
                        
                        <td className={`relative py-1.5 sm:py-3 px-1 sm:px-2 border-r-2 border-slate-700 ${bBottomClass} text-center align-middle`}>
                          {isNextWeek && <div className="absolute -inset-[2px] pointer-events-none z-[20]" style={getWeekOverlayBorders(isNextWeek, isFirstRow, isLastRow, 'mid', isTopBorderDay, isBottomBorderDay)} />}
                          <div className="flex justify-center items-center w-full h-full relative z-10">
                            <span className={`text-[9px] sm:text-xs px-1 sm:px-2 py-0.5 sm:py-1 rounded border whitespace-nowrap font-bold leading-none ${getTypeBadgeColor(event.type)}`}>
                              {event.type || '予定'}
                            </span>
                          </div>
                        </td>

                        <td className={`relative py-1.5 sm:py-3 px-0.5 sm:px-2 border-r-2 border-slate-700 ${bBottomClass} text-center font-bold text-gray-700 text-[10px] sm:text-sm whitespace-nowrap`}>
                          {isNextWeek && <div className="absolute -inset-[2px] pointer-events-none z-[20]" style={getWeekOverlayBorders(isNextWeek, isFirstRow, isLastRow, 'mid', isTopBorderDay, isBottomBorderDay)} />}
                          <span className="relative z-10">{event.type === '休み' ? '-' : (event.time ? `${event.time}〜` : '-')}</span>
                        </td>
                        
                        <td className={`relative py-1.5 sm:py-3 px-0.5 sm:px-4 border-r-2 border-slate-700 ${bBottomClass} text-center font-bold break-words whitespace-pre-wrap text-[10px] sm:text-sm ${event.type === '休み' || event.title === '休み' ? 'text-red-600' : 'text-gray-800'}`}>
                          {isNextWeek && <div className="absolute -inset-[2px] pointer-events-none z-[20]" style={getWeekOverlayBorders(isNextWeek, isFirstRow, isLastRow, 'mid', isTopBorderDay, isBottomBorderDay)} />}
                          <span className="relative z-10">{event.type === '休み' ? '' : event.title}</span>
                        </td>
                        
                        <td className={`relative py-1.5 sm:py-3 px-0.5 sm:px-2 ${isPresident ? 'border-r-2 border-slate-700' : ''} ${bBottomClass} text-center font-bold break-words whitespace-pre-wrap text-[10px] sm:text-sm text-gray-600`}>
                          {isNextWeek && <div className="absolute -inset-[2px] pointer-events-none z-[20]" style={getWeekOverlayBorders(isNextWeek, isFirstRow, isLastRow, !isPresident ? 'last' : 'mid', isTopBorderDay, isBottomBorderDay)} />}
                          <span className="relative z-10">{event.note || ''}</span>
                        </td>
                        
                        {isPresident && (
                          <td className={`relative py-1.5 sm:py-3 px-0.5 sm:px-2 ${bBottomClass} text-center`}>
                            {isNextWeek && <div className="absolute -inset-[2px] pointer-events-none z-[20]" style={getWeekOverlayBorders(isNextWeek, isFirstRow, isLastRow, 'last', isTopBorderDay, isBottomBorderDay)} />}
                            <div className="flex justify-center items-center relative z-30">
                              <button onClick={() => handleEditEventClick(event, day)} className="p-1 sm:p-1.5 text-gray-400 hover:text-[#1E5A99] hover:bg-blue-50 rounded transition" title="予定を編集">
                                <Edit3 className="w-3.5 h-3.5 sm:w-4 sm:h-4" />
                              </button>
                            </div>
                          </td>
                        )}
                      </tr>
                      );
                    });
                  })}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

        </div>

        {/* 予定の追加・編集モーダル */}
        {showAddModal && (
          <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
            <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-200">
              <div className="bg-[#124285] p-4 flex justify-between items-center text-white">
                <h3 className="font-bold text-lg">
                  {selectedDateForAdd.getMonth() + 1}月{selectedDateForAdd.getDate()}日の予定を{editingEventId ? '編集' : '追加'}
                </h3>
                <button onClick={() => setShowAddModal(false)} className="hover:bg-white/20 p-1 rounded-full transition">
                  <X size={24} />
                </button>
              </div>
              
              <form onSubmit={handleAddEvent} className="p-6 flex flex-col gap-4">
                {filterPerson === '全員' && (
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1">担当</label>
                    <select
                      value={selectedPerson}
                      onChange={(e) => setSelectedPerson(e.target.value)}
                      className="w-full h-11 border border-gray-300 rounded-lg px-3 focus:ring-2 focus:ring-[#124285] focus:border-[#124285] outline-none bg-white text-base"
                    >
                      {allMembers.map(m => (
                        <option key={m.id} value={m.name}>{m.name}</option>
                      ))}
                    </select>
                  </div>
                )}

                <div>
                  <label className="block text-xs font-bold text-gray-600 mb-1">種別</label>
                  <select
                    value={newEventType}
                    onChange={(e) => {
                      const selectedType = e.target.value;
                      setNewEventType(selectedType);
                      if (selectedType === '休み') {
                        setNewEventTitle('休み');
                      } else if (newEventTitle === '休み') {
                        setNewEventTitle('');
                      }
                    }}
                    className="w-full h-11 border border-gray-300 rounded-lg px-3 focus:ring-2 focus:ring-[#124285] focus:border-[#124285] outline-none bg-white text-base"
                  >
                    <option value="現場">現場</option>
                    <option value="内業">内業</option>
                    <option value="打合せ">打合せ</option>
                    <option value="休み">休み</option>
                    <option value="その他">その他</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-600 mb-1">開始時間</label>
                  <div className="flex items-center gap-1 w-1/2">
                    <input
                      type="text"
                      inputMode="numeric"
                      maxLength={2}
                      placeholder="時"
                      value={newEventHour}
                      onChange={(e) => {
                        const val = e.target.value.replace(/\D/g, '');
                        if (val === '' || parseInt(val) <= 23) {
                          setNewEventHour(val);
                        }
                      }}
                      onBlur={() => {
                        if (newEventHour.length === 1) setNewEventHour('0' + newEventHour);
                      }}
                      className="w-full h-11 border border-gray-300 rounded-lg px-1 sm:px-2 text-center focus:ring-2 focus:ring-[#124285] focus:border-[#124285] outline-none bg-white text-base"
                    />
                    <span className="font-bold text-gray-600">：</span>
                    <input
                      type="text"
                      inputMode="numeric"
                      maxLength={2}
                      placeholder="分"
                      value={newEventMinute}
                      onChange={(e) => {
                        const val = e.target.value.replace(/\D/g, '');
                        if (val === '' || parseInt(val) <= 59) {
                          setNewEventMinute(val);
                        }
                      }}
                      onBlur={() => {
                        if (newEventMinute.length === 1) setNewEventMinute('0' + newEventMinute);
                      }}
                      className="w-full h-11 border border-gray-300 rounded-lg px-1 sm:px-2 text-center focus:ring-2 focus:ring-[#124285] focus:border-[#124285] outline-none bg-white text-base"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-600 mb-1">現場名・内容</label>
                  <input
                    type="text"
                    value={newEventTitle}
                    onChange={(e) => setNewEventTitle(e.target.value)}
                    placeholder="例：長沼現場"
                    className="w-full h-11 border border-gray-300 rounded-lg px-3 focus:ring-2 focus:ring-[#124285] focus:border-[#124285] outline-none text-base"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-600 mb-1">備考</label>
                  <input
                    type="text"
                    value={newEventNote}
                    onChange={(e) => setNewEventNote(e.target.value)}
                    placeholder="例：変更の場合あり"
                    className="w-full h-11 border border-gray-300 rounded-lg px-3 focus:ring-2 focus:ring-[#124285] focus:border-[#124285] outline-none text-base"
                  />
                </div>
                
                <div className="flex justify-between items-center mt-2">
                  <div>
                    {editingEventId && (
                      <button
                        type="button"
                        onClick={() => {
                          handleDeleteEvent(editingEventId);
                          setShowAddModal(false);
                        }}
                        className="px-3 py-2 text-red-600 font-bold rounded-lg hover:bg-red-50 transition flex items-center gap-1"
                        title="この予定を削除"
                      >
                        <Trash2 size={18} />
                        <span className="text-sm">削除</span>
                      </button>
                    )}
                  </div>
                  <div className="flex justify-end gap-2 sm:gap-3">
                    <button
                      type="button"
                      onClick={() => setShowAddModal(false)}
                      className="px-4 sm:px-5 py-2 sm:py-2.5 border border-gray-300 text-gray-700 font-bold rounded-lg hover:bg-gray-50 transition text-sm sm:text-base"
                    >
                      キャンセル
                    </button>
                    <button
                      type="submit"
                      className="px-4 sm:px-5 py-2 sm:py-2.5 bg-[#124285] text-white font-bold rounded-lg hover:bg-[#154374] transition text-sm sm:text-base"
                    >
                      {editingEventId ? '更新する' : '追加する'}
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        )}

        {/* メンバー追加モーダル */}
        {showAddMemberModal && (
          <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
            <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden animate-in fade-in zoom-in duration-200">
              <div className="bg-gray-100 border-b border-gray-200 p-4 flex justify-between items-center text-gray-800">
                <h3 className="font-bold text-lg flex items-center gap-2">
                  <User size={20} className="text-gray-500" />
                  担当者を追加
                </h3>
                <button onClick={() => setShowAddMemberModal(false)} className="hover:bg-gray-200 p-1 rounded-full transition text-gray-500">
                  <X size={24} />
                </button>
              </div>
              
              <form onSubmit={handleAddMember} className="p-6 flex flex-col gap-4">
                <div className="flex gap-4">
                  <div className="flex-1">
                    <label className="block text-xs font-bold text-gray-600 mb-2">姓</label>
                    <input
                      type="text"
                      autoFocus
                      value={newMemberLastName}
                      onChange={(e) => setNewMemberLastName(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter') {
                          e.preventDefault();
                          firstNameRef.current?.focus();
                        }
                      }}
                      placeholder="例：山田"
                      className="w-full h-11 border border-gray-300 rounded-lg px-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-base"
                    />
                  </div>
                  <div className="flex-1">
                    <label className="block text-xs font-bold text-gray-600 mb-2">名</label>
                    <input
                      type="text"
                      ref={firstNameRef}
                      value={newMemberFirstName}
                      onChange={(e) => setNewMemberFirstName(e.target.value)}
                      placeholder="例：太郎"
                      className="w-full h-11 border border-gray-300 rounded-lg px-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-base"
                    />
                  </div>
                </div>
                
                <div className="flex justify-end gap-3 mt-4">
                  <button
                    type="button"
                    onClick={() => setShowAddMemberModal(false)}
                    className="px-4 py-2 border border-gray-300 text-gray-700 font-bold rounded-lg hover:bg-gray-50 transition"
                  >
                    キャンセル
                  </button>
                  <button
                    type="submit"
                    disabled={!newMemberLastName.trim() || !newMemberFirstName.trim()}
                    className="px-4 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition disabled:opacity-50"
                  >
                    追加する
                  </button>
                </div>
              </form>
            </div>
          </div>
        )}

        {/* メンバー管理モーダル */}
        {showManageMembersModal && (
          <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
            <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden animate-in fade-in zoom-in duration-200">
              <div className="bg-gray-100 border-b border-gray-200 p-4 flex justify-between items-center text-gray-800">
                <h3 className="font-bold text-lg flex items-center gap-2">
                  <Settings size={20} className="text-gray-500" />
                  メンバー管理
                </h3>
                <button onClick={() => setShowManageMembersModal(false)} className="hover:bg-gray-200 p-1 rounded-full transition text-gray-500">
                  <X size={24} />
                </button>
              </div>
              
              <div className="p-4 flex flex-col gap-2 max-h-[60vh] overflow-y-auto">
                {customMembers.map(member => (
                  <div key={member.id} className="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                    <span className="font-bold text-gray-700">{member.name}</span>
                    <button 
                      onClick={() => setMemberToDelete(member)}
                      className="p-2 text-red-500 hover:bg-red-50 rounded-full transition"
                      title="削除"
                    >
                      <Trash2 size={18} />
                    </button>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* 削除確認モーダル */}
        {memberToDelete && (
          <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-[60]">
            <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 animate-in fade-in zoom-in duration-200">
              <h3 className="font-bold text-lg mb-2">確認</h3>
              <p className="text-gray-600 mb-6">
                「{memberToDelete.name}」さんを削除してもよろしいですか？<br/>
                この操作は取り消せません。
              </p>
              <div className="flex justify-end gap-3">
                <button
                  onClick={() => setMemberToDelete(null)}
                  className="px-4 py-2 border border-gray-300 text-gray-700 font-bold rounded-lg hover:bg-gray-50 transition"
                >
                  キャンセル
                </button>
                <button
                  onClick={handleDeleteMember}
                  className="px-4 py-2 bg-red-600 text-white font-bold rounded-lg hover:bg-red-700 transition"
                >
                  削除する
                </button>
              </div>
            </div>
          </div>
        )}

        {/* 管理者パスワード入力モーダル */}
        {showPasswordModal && (
          <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[70]">
            <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden animate-in fade-in zoom-in duration-200">
              <div className="bg-[#124285] p-4 flex justify-between items-center text-white">
                <h3 className="font-bold text-lg flex items-center gap-2">
                  管理者の確認
                </h3>
                <button onClick={() => setShowPasswordModal(false)} className="hover:bg-white/20 p-1 rounded-full transition">
                  <X size={24} />
                </button>
              </div>
              
              <form onSubmit={handlePasswordSubmit} className="p-6 flex flex-col gap-4">
                <p className="text-sm text-gray-600 font-bold mb-2 leading-relaxed">
                  {pendingUser}は管理者として登録されています。<br />
                  設定を変更するにはパスワードを入力してください。
                </p>
                <div>
                  <input
                    type="password"
                    autoFocus
                    value={inputPassword}
                    onChange={(e) => setInputPassword(e.target.value)}
                    placeholder="パスワード"
                    className="w-full h-11 border border-gray-300 rounded-lg px-3 focus:ring-2 focus:ring-[#124285] focus:border-[#124285] outline-none text-base"
                  />
                  {passwordError && (
                    <p className="text-red-500 text-xs font-bold mt-2">{passwordError}</p>
                  )}
                </div>
                
                <div className="flex justify-end gap-3 mt-2">
                  <button
                    type="button"
                    onClick={() => setShowPasswordModal(false)}
                    className="px-4 py-2 border border-gray-300 text-gray-700 font-bold rounded-lg hover:bg-gray-50 transition"
                  >
                    キャンセル
                  </button>
                  <button
                    type="submit"
                    disabled={!inputPassword}
                    className="px-4 py-2 bg-[#124285] text-white font-bold rounded-lg hover:bg-[#154374] transition disabled:opacity-50"
                  >
                    認証する
                  </button>
                </div>
              </form>
            </div>
          </div>
        )}

      </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
